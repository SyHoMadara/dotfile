<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family" compare="eq"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="append" binding="strong"><string>Vazir Code</string></edit>
  </match>
  <!-- Enlarge Persian glyphs slightly without changing the Latin font. -->
  <match target="font">
    <test name="family" compare="eq"><string>Vazir Code</string></test>
    <edit name="pixelsize" mode="assign">
      <times><name>pixelsize</name><double>1.12</double></times>
    </edit>
  </match>
</fontconfig>
